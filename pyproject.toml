[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tariff-shock-forecaster"
version = "0.1.0"
description = "Real-time supply chain disruption forecaster"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"