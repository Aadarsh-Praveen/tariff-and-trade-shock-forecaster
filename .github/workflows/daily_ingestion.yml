# .github/workflows/daily_ingestion.yml
#
# Runs all 4 ingestion clients every day at 06:00 UTC automatically.
# Can also be triggered manually from the GitHub Actions tab.
#
# Setup required (one time only):
#   GitHub repo → Settings → Secrets and variables → Actions → New secret
#   Add each key listed in the "Set environment variables" step below.

name: Daily data ingestion

on:
  schedule:
    - cron: "0 6 * * *"    # Every day at 06:00 UTC
  workflow_dispatch:         # Manual trigger from GitHub Actions tab

jobs:
  ingest:
    name: Run all ingestion clients
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run FRED ingestion
        env:
          FRED_API_KEY:  ${{ secrets.FRED_API_KEY }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
          LOG_LEVEL:     INFO
          ENVIRONMENT:   production
        run: PYTHONPATH=$(pwd) python -m src.ingestion.fred_client

      - name: Run Alpha Vantage ingestion
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:          ${{ secrets.SUPABASE_KEY }}
          LOG_LEVEL:             INFO
          ENVIRONMENT:           production
        run: PYTHONPATH=$(pwd) python -m src.ingestion.alpha_client

      - name: Run Polymarket ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LOG_LEVEL:    INFO
          ENVIRONMENT:  production
        run: PYTHONPATH=$(pwd) python -m src.ingestion.polymarket_client

      - name: Run NewsAPI + SEC ingestion
        env:
          NEWSAPI_KEY:  ${{ secrets.NEWSAPI_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LOG_LEVEL:    INFO
          ENVIRONMENT:  production
        run: PYTHONPATH=$(pwd) python -m src.ingestion.news_client

      - name: Log completion
        run: |
          echo "All ingestion clients completed — $(date -u)"